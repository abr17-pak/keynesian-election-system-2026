{% extends "base_public.html" %}
{% block title %}Student Login{% endblock %}
{% block public_content %}

<div class="public-brand">
    <img src="{{ url_for('static', filename='images/logo.png.jpeg') }}" class="logo-img" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="mark" style="display:none;">KI</div>
    <div>
        <h2>Keynesian Institute</h2>
        <p>Digital Election System</p>
    </div>
</div>

<p class="eyebrow">Voter access</p>
<h1>Student Login</h1>
<p class="lead">Enter your details exactly as registered to continue to the ballot.</p>

<form method="POST">

    <div class="form-row">
        <label>Name</label>
        <input type="text" name="name" required>
    </div>

    <div class="form-row">
        <label>Class</label>
        <input type="text" name="student_class" required>
    </div>

    <button type="submit">Continue to Vote</button>

</form>

{% endblock %}
