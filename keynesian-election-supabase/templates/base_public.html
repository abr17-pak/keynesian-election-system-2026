<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Keynesian Institute{% endblock %} · Digital Election System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="public-shell">
    <div class="public-card {% block card_size %}{% endblock %}">
        {% block public_content %}
        {% endblock %}
    </div>
</div>

<footer>
    Digital Election Management System
    <br>© Keynesian Institute Of Management And Sciences
</footer>

<script>lucide.createIcons();</script>

</body>
</html>
