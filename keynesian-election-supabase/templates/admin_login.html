{% extends "base_public.html" %}
{% block title %}Administrator Login{% endblock %}
{% block public_content %}

<div class="public-brand">
    <img src="{{ url_for('static', filename='images/logo.png.jpeg') }}" class="logo-img" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="mark" style="display:none;">KI</div>
    <div>
        <h2>Keynesian Institute</h2>
        <p>Digital Election System</p>
    </div>
</div>

<p class="eyebrow">Restricted access</p>
<h1>Administrator Login</h1>
<p class="lead">Sign in to manage students, positions, candidates and results.</p>

<form method="POST">

    <div class="form-row">
        <label>Username</label>
        <input type="text" name="username" required>
    </div>

    <div class="form-row">
        <label>Password</label>
        <input type="password" name="password" required>
    </div>

    <button type="submit">Login</button>

</form>

{% endblock %}
